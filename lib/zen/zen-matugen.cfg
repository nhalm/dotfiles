// Autoconfig runs with chrome privileges at startup; the first line is skipped.
//
// Zen reads userChrome.css once, at startup, and exposes no way to ask a
// running instance to read it again. This polls the matugen palette and pushes
// it into every open window as a user-origin sheet, which is the same origin
// userChrome.css gets -- so !important still outranks Zen's own rules.
try {
	const Svc =
		typeof Services !== "undefined"
			? Services
			: ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;

	const PALETTE =
		Svc.dirsvc.get("Home", Ci.nsIFile).path + "/.local/state/matugen/zen-colors.css";
	const POLL_MS = 5000;

	let currentURI = null;
	let lastStamp = 0;

	const readText = function (path) {
		const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
		file.initWithPath(path);
		if (!file.exists()) {
			return null;
		}
		const fis = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(
			Ci.nsIFileInputStream
		);
		fis.init(file, 0x01, 0o444, 0);
		const cis = Cc["@mozilla.org/intl/converter-input-stream;1"].createInstance(
			Ci.nsIConverterInputStream
		);
		cis.init(fis, "UTF-8", 0, 0);
		let text = "";
		const chunk = {};
		while (cis.readString(4096, chunk) != 0) {
			text += chunk.value;
		}
		cis.close();
		fis.close();
		return text;
	};

	const stampOf = function (path) {
		const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
		file.initWithPath(path);
		return file.exists() ? file.lastModifiedTime : 0;
	};

	const applyTo = function (win, uri) {
		const wu = win.windowUtils;
		if (currentURI) {
			try {
				wu.removeSheetUsingURIString(currentURI, wu.USER_SHEET);
			} catch (e) {}
		}
		try {
			wu.loadSheetUsingURIString(uri, wu.USER_SHEET);
		} catch (e) {}
	};

	const refresh = function () {
		const stamp = stampOf(PALETTE);
		if (!stamp || stamp === lastStamp) {
			return;
		}
		const text = readText(PALETTE);
		if (!text) {
			return;
		}
		lastStamp = stamp;
		const uri = "data:text/css;charset=utf-8," + encodeURIComponent(text);

		const windows = Svc.wm.getEnumerator("navigator:browser");
		while (windows.hasMoreElements()) {
			applyTo(windows.getNext(), uri);
		}
		currentURI = uri;
	};

	// A window opened after a change would otherwise show the palette that was
	// on disk when the process started.
	Svc.obs.addObserver(
		{
			observe(subject, topic) {
				if (topic !== "domwindowopened" || !currentURI) {
					return;
				}
				subject.addEventListener(
					"load",
					function () {
						if (
							subject.document.documentElement.getAttribute("windowtype") ===
							"navigator:browser"
						) {
							try {
								subject.windowUtils.loadSheetUsingURIString(
									currentURI,
									subject.windowUtils.USER_SHEET
								);
							} catch (e) {}
						}
					},
					{ once: true }
				);
			},
		},
		"domwindowopened"
	);

	const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
	timer.initWithCallback(
		{
			notify() {
				try {
					refresh();
				} catch (e) {}
			},
		},
		POLL_MS,
		Ci.nsITimer.TYPE_REPEATING_SLACK
	);
	globalThis.__zenMatugenTimer = timer;
} catch (e) {
	// Never let this stop the browser from starting.
}
