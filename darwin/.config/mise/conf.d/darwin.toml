# macOS-only runtimes, merged on top of the shared ~/.config/mise/config.toml.
# mise loads conf.d/*.toml first, then config.toml, merging tools additively.
[tools]
# Not majored: SbarLua builds against 5.5, so a 5.6 would break sketchybar.
lua = "5.5"
ruby = "3"
bun = "1"

# No brew formula, so it comes from crates.io against the rust above.
"cargo:matugen" = "4"

# Through the npm backend, not `npm install -g`: the latter drops binaries into
# the active node's prefix, so a node major bump orphans them.
# carbonyl publishes nothing but prereleases, which mise filters out of a range,
# so it is the one tool that has to name an exact build.
"npm:carbonyl" = "0.0.2-next.bacf3db"
"npm:@mermaid-js/mermaid-cli" = "11"
"npm:ccusage" = "20"
