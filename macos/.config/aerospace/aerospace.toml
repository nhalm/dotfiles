config-version = 2

# Version 2 stops inferring these from the keybindings below. Without them the
# list is empty and a workspace disappears the moment its last window closes --
# which would empty the sketchybar chips, since those come from
# `aerospace list-workspaces --all`.
persistent-workspaces = ['1', '2', '3', '4', '5', '6']

after-startup-command = [
  'exec-and-forget sketchybar',
  'exec-and-forget borders active_color=0xffbb9af7 inactive_color=0xff494d64 width=5.0'
]

# sketchybar follows workspaces and windows through `aerospace subscribe`
# (sketchybar/helpers/aerospace_events.sh), not exec-on-workspace-change.

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.electron.wispr-flow'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenSharing'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = 'move-node-to-workspace 1'

[key-mapping]
  preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
[gaps]
  inner.horizontal = 20
  inner.vertical =   20
  outer.left =       20
  outer.bottom =     20
  outer.top =        [{ monitor."Built-in" = 20 }, 56]
  outer.right =      20

[mode.main.binding]

    # The wallpaper popup under sketchybar's wallpaper item, search focused.
    ctrl-alt-cmd-w = 'exec-and-forget sketchybar --trigger barpop_open POPUP=wallpaper'

    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'

    ctrl-alt-cmd-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-cmd-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-cmd-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-cmd-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-cmd-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-cmd-shift-6 = 'move-node-to-workspace 6'

    # alt+hjkl is left free for herdr-splits to resize nvim splits and herdr
    # panes; focus and move sit on caps and caps+shift instead.
    ctrl-alt-cmd-h = 'focus left'
    ctrl-alt-cmd-j = 'focus down'
    ctrl-alt-cmd-k = 'focus up'
    ctrl-alt-cmd-l = 'focus right'

    ctrl-alt-cmd-shift-h = 'move left'
    ctrl-alt-cmd-shift-j = 'move down'
    ctrl-alt-cmd-shift-k = 'move up'
    ctrl-alt-cmd-shift-l = 'move right'

    ctrl-alt-cmd-tab = 'workspace-back-and-forth'
    ctrl-alt-cmd-shift-tab = 'move-workspace-to-monitor --wrap-around next'  # laptop (caps+shift+tab)
    ctrl-alt-cmd-m = 'move-workspace-to-monitor --wrap-around next'

    alt-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    h = ['join-with left', 'mode main']
    j = ['join-with down', 'mode main']
    k = ['join-with up', 'mode main']
    l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

