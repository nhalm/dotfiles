[tools]
node = "lts"
go = "latest"
rust = "latest"
zoxide = "latest"
lazygit = "latest"
# Agent runtime: persistent agent sessions, panes, git worktrees. Replaces tmux.
herdr = "latest"

# Claude Code's status line. Installed through mise's npm backend rather than
# `npm install -g`, which drops binaries into the *active* node's global prefix
# -- so a node = "lts" rollover would silently orphan it. The npm backend gives
# it its own tool directory and shim, and mise orders node before npm: tools.
"npm:ccstatusline" = "latest"

# No global python on purpose. `mise activate` prepends its shims in an
# interactive shell, so a global pin shadows the distro interpreter -- and every
# system script shebanged `#!/usr/bin/env python3` that imports a packaged
# module then fails by hand: powerprofilesctl (gi), run-clang-tidy (yaml),
# scan-build-py (libscanbuild), and others. Nothing was installed into the mise
# python anyway. Pin python per project instead; auto_install fetches it.

[settings]
idiomatic_version_file_enable_tools = ["node"]
auto_install = true
not_found_auto_install = true
