# Rendered to ~/.config/wayvnc/config (0600) by install/linux.sh, which appends
# password= from 1Password "BigBox VNC". DES VNC-Auth (allow_broken_crypto) is
# what macOS Screen Sharing speaks; only the first 8 characters count.
address=127.0.0.1
port=5900
enable_auth=true
enable_pam=false
allow_broken_crypto=true
relax_encryption=true
rsa_private_key_file=rsa_key.pem
