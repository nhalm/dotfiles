# sshd hardening. Installed by lib/system.sh.
#
# sshd takes the FIRST value it sees for most keywords, and
# /etc/ssh/sshd_config Includes this directory on its very first line, so
# everything here wins over the defaults further down that file. Where
# 99-archlinux.conf already sets the same value the overlap is harmless.

# Keys only. Password auth over the network is brute-forceable.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Root has no reason to log in over the network; use sudo from a user session.
# OpenSSH defaults to prohibit-password, which is weaker than this.
PermitRootLogin no

# Only this account, never a system user that happens to acquire a shell.
AllowUsers nick

# Post-quantum hybrid key exchange first: mlkem768x25519 is the OpenSSH 10
# default and protects today's traffic against later decryption. Classical
# fallbacks are all >=128-bit; none of the weak DH groups are listed.
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org

# AEAD only -- no CBC, no unauthenticated stream ciphers.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com

# Encrypt-then-MAC, SHA-2 only. Moot while every cipher above is AEAD, but it
# stops a downgrade to a non-AEAD cipher from being useful.
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com

HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com

# Shrink the window and blast radius of an unauthenticated connection.
LoginGraceTime 20
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60

# Nothing here forwards, tunnels, or serves files.
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

ClientAliveInterval 300
ClientAliveCountMax 2
