# Kernel hardening. Installed by lib/system.sh, not stow -- see that file.
# Arch's own defaults already cover most of this; these are the gaps.

# Hide kernel pointers from /proc and dmesg, which would otherwise hand a local
# exploit the KASLR offsets it needs.
kernel.kptr_restrict = 1

# Refuse to load a replacement kernel at runtime, which a root exploit could
# otherwise use to boot an unsigned kernel and survive a reboot.
kernel.kexec_load_disabled = 1

# This is a laptop, not a router: never emit ICMP redirects.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept routes or redirects pushed by anything on the network.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast pings (smurf amplification) and bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Never write a core dump for a setuid binary.
fs.suid_dumpable = 0
