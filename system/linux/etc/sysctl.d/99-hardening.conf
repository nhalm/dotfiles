# Kernel hardening. Installed by lib/system.sh, not stow -- see that file.
#
# Arch already ships sane values for most of this (dmesg_restrict=1,
# yama.ptrace_scope=1, unprivileged_bpf_disabled=2, the fs.protected_* family,
# rp_filter=1, tcp_syncookies=1). Only the genuine gaps are set here, so this
# file stays short enough to actually review.

# Hide kernel pointers from /proc and dmesg. Arch leaves this at 0, which hands
# a local exploit the KASLR offsets it needs. 1 = hide from unprivileged users.
kernel.kptr_restrict = 1

# Refuse to load a replacement kernel at runtime. Nothing on a laptop uses
# kexec; leaving it enabled gives a root exploit a way to boot an unsigned
# kernel and survive. One-way switch until reboot.
kernel.kexec_load_disabled = 1

# This is a laptop, not a router: never emit ICMP redirects.
# NB: net.ipv4.ip_forward is deliberately NOT set here -- Docker sets it to 1
# and needs it. Forcing it to 0 breaks all container networking.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Don't accept routes or redirects pushed by anything on the network.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log packets with impossible source addresses.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast pings (smurf amplification) and bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Never write a core dump for a setuid binary. Arch ships 2 (root-readable
# dumps); 0 is the hardened value and nothing here debugs setuid programs.
fs.suid_dumpable = 0

# ---------------------------------------------------------------------------
# Deliberately NOT set, because each of these breaks something on this machine:
#
#   kernel.yama.ptrace_scope = 2/3
#       Already 1, which is the right level. delve and gdb still debug their
#       own children; raising it further breaks attaching to a running process
#       (`dlv attach`, `gdb -p`) even with sudo at level 3.
#
#   user.max_user_namespaces = 0  /  unprivileged_userns_clone = 0
#       Would break Docker rootless, the Chrome/Electron sandbox, and the
#       1Password desktop app. Unprivileged userns is a net security *gain*
#       here because it is what those sandboxes are built on.
#
#   kernel.unprivileged_bpf_disabled
#       Already 2. Left alone.
#
#   net.core.bpf_jit_harden
#       Not present on this kernel (the BPF JIT sysctl is not compiled in), and
#       an unknown key makes `sysctl --system` error on every boot. With
#       unprivileged_bpf_disabled=2 there is nothing left to harden anyway.
#
#   net.ipv4.ip_forward = 0
#       Docker requires 1. See above.
#
#   kernel.modules_disabled = 1
#       Blocks all module loading after boot; breaks docker (overlay, br_netfilter),
#       VPNs, and USB peripherals that pull a driver in late.
# ---------------------------------------------------------------------------
