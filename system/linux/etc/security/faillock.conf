# Lockout policy for failed authentications, including the hyprlock screen.
#
# pam_faillock is wired into /etc/pam.d/system-auth by Arch's pambase, but this
# file ships empty, so the policy was whatever the library was compiled with.
#
# The `pam` package owns this file and there is no drop-in directory for it, so
# pacman writes a .pacnew beside it on upgrade -- reconcile with `pacdiff`.

# Lock the account after this many consecutive failures.
deny = 5

# Failures older than this stop counting toward the deny threshold.
fail_interval = 900

# How long a lockout lasts before it clears on its own. 15 minutes makes
# online guessing against the lock screen pointless while never needing a
# rescue disk to recover from a fat-fingered password.
unlock_time = 900
