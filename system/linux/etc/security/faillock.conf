# Lockout policy for failed authentications, including the hyprlock screen.
#
# pam_faillock is already wired into /etc/pam.d/system-auth by Arch's pambase,
# but this file ships empty, so the policy was whatever the library was
# compiled with. Stating it makes it reviewable and survives a pambase change.
#
# NB: unlike sysctl.d or sshd_config.d, this file is owned by the `pam`
# package and has no drop-in directory. Replacing it means pacman will write a
# .pacnew beside it on upgrade rather than reverting it -- reconcile with
# `pacdiff` (pacman-contrib, already installed).

# Lock the account after this many consecutive failures.
deny = 5

# Failures older than this stop counting toward the deny threshold.
fail_interval = 900

# How long a lockout lasts before it clears on its own. 15 minutes makes
# online guessing against the lock screen pointless while never needing a
# rescue disk to recover from a fat-fingered password.
unlock_time = 900

# Deliberately NOT setting `even_deny_root`. Locking root out of the console
# risks needing rescue media to get back in, and buys little here: the disk is
# unencrypted, so anyone with the physical access needed to reach a console can
# already read everything by pulling the drive. Revisit once the root
# filesystem is encrypted.
