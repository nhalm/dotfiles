# Overrides /etc/spotify-launcher.conf, whose own comments suggest these flags.
#
# Spotify is an Electron app that defaults to X11, and was the only XWayland
# client in `hyprctl clients`. Native Wayland is not about CPU -- playback costs
# about 12% of a core either way -- it is for fractional scaling: XWayland gets
# scaled by the compositor at 1.25 and looks soft.
#
# Test a change with `spotify-launcher -v --skip-update --no-exec`, which prints
# the assembled command without launching anything.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
