# No dpms listener: hl.dsp.dpms toggles every monitor and ignores its
# arguments, so any monitor that changes state independently -- as happens
# during lock -- desyncs permanently, with no way back. hyprlock blanks the
# screen at the lock timeout instead.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = ~/.local/scripts/suspend-if-on-battery.sh
}
