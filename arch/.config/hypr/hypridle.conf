# Screens are powered down with wlopm, not hl.dsp.dpms: the dispatcher ignores
# its argument and toggles every monitor, so a monitor that changed state on its
# own -- as happens during lock -- desyncs permanently with no way back. wlopm
# speaks zwlr_output_power_manager_v1 directly and takes an explicit on/off.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

# 20 minutes, not 30: the screen is already off at 15, and the machine sat at
# 6-8W for the remaining quarter hour. The script is a no-op on AC, so this
# timeout only ever fires on battery.
#
# ignore_inhibit, because zen holds an org.freedesktop.ScreenSaver inhibit
# reading "Playing video" for as long as a video is *loaded*, paused or not, and
# hypridle then logs "Ignoring from onIdled(), inhibit locks: 1" and the machine
# never sleeps. The script asks MPRIS whether anything is actually playing
# instead, which is the question the inhibit was meant to answer.
listener {
    timeout = 1200
    on-timeout = ~/.local/scripts/suspend-if-on-battery.sh
    ignore_inhibit = true
}
