# Screens are powered down with wlopm, not hl.dsp.dpms: the dispatcher ignores
# its argument and toggles every monitor, so a monitor that changed state on its
# own -- as happens during lock -- desyncs permanently with no way back. wlopm
# speaks zwlr_output_power_manager_v1 directly and takes an explicit on/off.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

# ignore_inhibit: zen's "Playing video" lock outlives playback. See docs/linux.md.
listener {
    timeout = 1200
    on-timeout = ~/.local/scripts/suspend-if-on-battery.sh
    ignore_inhibit = true
}
