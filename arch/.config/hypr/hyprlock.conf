general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1f2335ff)
    blur_passes = 0
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 10

    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(24283bff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(e0af68ff)
    fail_color = rgba(f7768eff)

    placeholder_text = <span foreground="##565f89">Password</span>
    fail_text = <span foreground="##f7768e">$FAIL ($ATTEMPTS)</span>
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(a9b1d6ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
