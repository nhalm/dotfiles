source = ~/.local/state/matugen/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    color = $background
    blur_passes = 0
}

input-field {
    monitor =
    size = 300, 50
    position = 0, -20
    halign = center
    valign = center

    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 10

    outer_color = $primary
    inner_color = $surface_container
    font_color = $on_surface
    check_color = $tertiary
    fail_color = $error

    placeholder_text = <span foreground="$outline">Password</span>
    fail_text = <span foreground="$error">$FAIL ($ATTEMPTS)</span>
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $on_surface
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $on_surface_variant
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}
